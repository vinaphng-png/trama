<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra Cứu Vật Tư</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0f1117;
    --surface:   #181c27;
    --surface2:  #1f2436;
    --border:    #2a3048;
    --accent:    #00d4ff;
    --accent2:   #ff6b35;
    --text:      #e8eaf0;
    --muted:     #6b7394;
    --success:   #00c896;
    --error:     #ff4d6a;
    --radius:    8px;
    --mono:      'IBM Plex Mono', monospace;
    --sans:      'Noto Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse 80% 40% at 50% -10%, rgba(0,212,255,.08) 0%, transparent 70%),
      linear-gradient(180deg, #0f1117 0%, #12151e 100%);
  }

  /* ---- HEADER ---- */
  header {
    border-bottom: 1px solid var(--border);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(15,17,23,.9);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), #0077ff);
    border-radius: 8px;
    display: grid; place-items: center;
    font-size: 18px;
    box-shadow: 0 0 16px rgba(0,212,255,.3);
  }
  header h1 {
    font-size: 16px; font-weight: 700; letter-spacing: .5px;
    color: var(--text);
  }
  header span {
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); margin-top: 2px; display: block;
  }

  /* ---- MAIN LAYOUT ---- */
  main { max-width: 1200px; margin: 0 auto; padding: 32px 20px; }

  /* ---- SEARCH BAR ---- */
  .search-wrap {
    position: relative;
    margin-bottom: 28px;
  }
  .search-wrap svg {
    position: absolute; left: 16px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  #searchInput {
    width: 100%;
    padding: 14px 52px 14px 48px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--sans); font-size: 15px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  #searchInput::placeholder { color: var(--muted); }
  #searchInput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,212,255,.12);
  }
  .search-clear {
    position: absolute; right: 14px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: var(--muted); display: none; padding: 4px;
  }
  .search-clear:hover { color: var(--text); }

  /* ---- STATUS BAR ---- */
  #statusBar {
    font-family: var(--mono); font-size: 12px;
    color: var(--muted); margin-bottom: 16px;
    height: 20px;
    display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- TABLE ---- */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
  }
  table { width: 100%; border-collapse: collapse; }
  thead tr {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }
  th {
    padding: 11px 14px;
    text-align: left;
    font-family: var(--mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: .8px;
    color: var(--muted); font-weight: 600;
    white-space: nowrap;
  }
  th:first-child { border-radius: 8px 0 0 0; }
  th:last-child  { border-radius: 0 8px 0 0; }

  tbody tr {
    border-bottom: 1px solid rgba(42,48,72,.5);
    transition: background .15s;
    cursor: pointer;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }

  td {
    padding: 11px 14px;
    font-size: 13.5px;
    vertical-align: middle;
    max-width: 260px;
  }
  .td-code {
    font-family: var(--mono); font-size: 12.5px;
    color: var(--accent); white-space: nowrap;
  }
  .td-name { font-weight: 600; color: var(--text); }
  .td-spec { color: var(--muted); font-size: 12.5px; }
  .badge {
    display: inline-block;
    padding: 2px 8px; border-radius: 4px;
    font-family: var(--mono); font-size: 11px;
    background: rgba(0,212,255,.1);
    color: var(--accent); border: 1px solid rgba(0,212,255,.2);
    white-space: nowrap;
  }
  .badge-kho {
    background: rgba(255,107,53,.1);
    color: var(--accent2); border-color: rgba(255,107,53,.2);
  }

  /* ---- ẢNH THUMBNAIL ---- */
  .thumb-cell {
    position: relative;
    display: flex; align-items: center; gap: 8px;
  }
  .thumb {
    width: 44px; height: 44px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: zoom-in;
    transition: transform .15s;
  }
  .thumb:hover { transform: scale(1.08); }
  .no-image {
    width: 44px; height: 44px;
    border-radius: 6px;
    border: 1px dashed var(--border);
    display: grid; place-items: center;
    color: var(--muted); font-size: 18px;
  }

  /* ---- UPLOAD BUTTON ---- */
  .btn-upload {
    padding: 5px 10px;
    background: rgba(0,212,255,.08);
    border: 1px solid rgba(0,212,255,.25);
    border-radius: 5px;
    color: var(--accent);
    font-size: 11px; font-family: var(--mono);
    cursor: pointer; white-space: nowrap;
    transition: background .15s;
  }
  .btn-upload:hover { background: rgba(0,212,255,.18); }
  input[type="file"] { display: none; }

  /* ---- EMPTY STATE ---- */
  #emptyState {
    text-align: center; padding: 64px 20px;
    color: var(--muted); display: none;
  }
  #emptyState .empty-icon { font-size: 48px; margin-bottom: 16px; }
  #emptyState p { font-size: 14px; line-height: 1.7; }

  /* ---- LIGHTBOX ---- */
  #lightbox {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.85);
    z-index: 999;
    place-items: center;
    backdrop-filter: blur(6px);
  }
  #lightbox.active { display: grid; }
  #lightbox img {
    max-width: 90vw; max-height: 88vh;
    border-radius: 10px;
    box-shadow: 0 24px 80px rgba(0,0,0,.6);
    animation: zoomIn .2s ease;
  }
  @keyframes zoomIn { from { transform: scale(.92); opacity:0; } to { transform: scale(1); opacity:1; } }
  #lightbox .lb-close {
    position: absolute; top: 20px; right: 24px;
    color: #fff; font-size: 28px;
    cursor: pointer; background: none; border: none;
    opacity: .7; line-height: 1;
  }
  #lightbox .lb-close:hover { opacity: 1; }

  /* ---- TOAST ---- */
  #toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(60px);
    padding: 10px 20px; border-radius: 8px;
    font-size: 13px; font-family: var(--mono);
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text);
    transition: transform .3s ease, opacity .3s;
    opacity: 0; z-index: 9999;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.toast-ok   { border-color: var(--success); color: var(--success); }
  #toast.toast-err  { border-color: var(--error);   color: var(--error);   }

  /* ---- UPLOAD PROGRESS OVERLAY ---- */
  .uploading-overlay {
    position: absolute; inset: 0;
    background: rgba(15,17,23,.75);
    display: grid; place-items: center;
    border-radius: 6px; z-index: 10;
  }
</style>
</head>
<body>

<header>
  <div class="logo-icon">🔍</div>
  <div>
    <h1>Tra Cứu Vật Tư</h1>
    <span>DỮ LIỆU WEB · Solaray</span>
  </div>
</header>

<main>
  <!-- Search -->
  <div class="search-wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input id="searchInput" type="text" placeholder="Tìm theo mã liệu, tên sản phẩm, quy cách..." autocomplete="off">
    <button class="search-clear" id="clearBtn" onclick="clearSearch()">✕</button>
  </div>

  <!-- Status -->
  <div id="statusBar"><span>Nhập từ khóa để tra cứu</span></div>

  <!-- Table -->
  <div class="table-wrap" id="tableWrap">
    <table id="resultTable">
      <thead>
        <tr>
          <th>Mã Liệu</th>
          <th>Tên Sản Phẩm</th>
          <th>Quy Cách</th>
          <th>Đơn Vị</th>
          <th>Kho</th>
          <th>Hình Ảnh</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="emptyState">
      <div class="empty-icon">📭</div>
      <p>Không tìm thấy kết quả phù hợp.<br>Thử tìm với từ khóa khác.</p>
    </div>
  </div>
</main>

<!-- Lightbox -->
<div id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <img id="lbImg" src="" alt="Hình ảnh">
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
let searchTimer;
let currentResults = [];

const tbody      = document.getElementById("tbody");
const statusBar  = document.getElementById("statusBar");
const emptyState = document.getElementById("emptyState");
const tableWrap  = document.getElementById("tableWrap");
const clearBtn   = document.getElementById("clearBtn");

// ---- Debounce search ----
document.getElementById("searchInput").addEventListener("input", function() {
  clearBtn.style.display = this.value ? "block" : "none";
  clearTimeout(searchTimer);
  if (!this.value.trim()) {
    setStatus("Nhập từ khóa để tra cứu");
    tbody.innerHTML = "";
    emptyState.style.display = "none";
    return;
  }
  searchTimer = setTimeout(() => doSearch(this.value.trim()), 350);
});

document.getElementById("searchInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") { clearTimeout(searchTimer); doSearch(this.value.trim()); }
});

function clearSearch() {
  document.getElementById("searchInput").value = "";
  clearBtn.style.display = "none";
  tbody.innerHTML = "";
  emptyState.style.display = "none";
  setStatus("Nhập từ khóa để tra cứu");
}

// ---- Search ----
function doSearch(kw) {
  if (!kw) return;
  setStatus(`<span class="spinner"></span> Đang tìm kiếm...`);
  google.script.run
    .withSuccessHandler(renderResults)
    .withFailureHandler(err => setStatus("❌ " + err.message))
    .search(kw);
}

// ---- Render ----
function renderResults(rows) {
  currentResults = rows;
  tbody.innerHTML = "";

  if (!rows || rows.length === 0) {
    emptyState.style.display = "block";
    setStatus(`<span class="dot"></span> Không có kết quả`);
    return;
  }
  emptyState.style.display = "none";
  setStatus(`<span class="dot"></span> Tìm thấy <strong style="color:var(--accent)">${rows.length}</strong> kết quả`);

  rows.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="td-code">${esc(r.maLieu)}</td>
      <td class="td-name">${esc(r.ten)}</td>
      <td class="td-spec">${esc(r.quyCach)}</td>
      <td><span class="badge">${esc(r.donVi)}</span></td>
      <td><span class="badge badge-kho">${esc(r.kho)}</span></td>
      <td>${renderImageCell(r)}</td>
    `;
    tbody.appendChild(tr);
  });
}

function renderImageCell(r) {
  const fileInputId = `file_${r.rowIndex}`;
  const cellId      = `imgCell_${r.rowIndex}`;

  let imgHtml = "";
  if (r.anh) {
    imgHtml = `<img class="thumb" src="${esc(r.anh)}" alt="ảnh" onclick="openLightbox('${esc(r.anh)}')">`;
  } else {
    imgHtml = `<div class="no-image" title="Chưa có ảnh">📷</div>`;
  }

  return `
    <div class="thumb-cell" id="${cellId}">
      ${imgHtml}
      <div>
        <label class="btn-upload" for="${fileInputId}">⬆ Tải ảnh</label>
        <input type="file" id="${fileInputId}" accept="image/*"
          onchange="handleUpload(this, ${r.rowIndex}, '${cellId}')">
        ${r.anh ? `<br><a href="${esc(r.anh)}" target="_blank" style="font-size:10px;color:var(--muted);font-family:var(--mono)">xem đầy đủ</a>` : ""}
      </div>
    </div>`;
}

// ---- Upload ----
function handleUpload(input, rowIndex, cellId) {
  const file = input.files[0];
  if (!file) return;

  const maxMB = 5;
  if (file.size > maxMB * 1024 * 1024) {
    showToast("Ảnh quá lớn (tối đa " + maxMB + "MB)", "err");
    return;
  }

  const cell = document.getElementById(cellId);
  // Show overlay
  const overlay = document.createElement("div");
  overlay.className = "uploading-overlay";
  overlay.innerHTML = `<span class="spinner" style="width:22px;height:22px;border-width:3px"></span>`;
  cell.style.position = "relative";
  cell.appendChild(overlay);

  const reader = new FileReader();
  reader.onload = function(e) {
    const base64Full  = e.target.result;           // "data:image/jpeg;base64,...."
    const base64Data  = base64Full.split(",")[1];  // chỉ phần base64
    const mimeType    = file.type;
    const fileName    = file.name;

    google.script.run
      .withSuccessHandler(function(res) {
        cell.removeChild(overlay);
        if (res.success) {
          showToast("✅ Đã lưu ảnh thành công!", "ok");
          // cập nhật thumbnail ngay
          const oldThumb = cell.querySelector(".thumb, .no-image");
          if (oldThumb) oldThumb.remove();
          const img = document.createElement("img");
          img.className = "thumb";
          img.src = res.url;
          img.alt = "ảnh";
          img.onclick = () => openLightbox(res.url);
          cell.insertBefore(img, cell.firstChild);
        } else {
          showToast("❌ " + (res.error || "Lỗi không xác định"), "err");
        }
      })
      .withFailureHandler(function(err) {
        cell.removeChild(overlay);
        showToast("❌ " + err.message, "err");
      })
      .uploadImage(base64Data, mimeType, fileName, rowIndex);
  };
  reader.readAsDataURL(file);
}

// ---- Lightbox ----
function openLightbox(url) {
  document.getElementById("lbImg").src = url;
  document.getElementById("lightbox").classList.add("active");
}
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("active");
  document.getElementById("lbImg").src = "";
}
document.getElementById("lightbox").addEventListener("click", function(e) {
  if (e.target === this) closeLightbox();
});

// ---- Helpers ----
function setStatus(html) { statusBar.innerHTML = html; }

function esc(s) {
  return String(s || "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

let toastTimer;
function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show " + (type === "ok" ? "toast-ok" : type === "err" ? "toast-err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = "toast"; }, 3500);
}
</script>
</body>
</html>
