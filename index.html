<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ERP PRODUCT SEARCH</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6f9;
}

/* HEADER */
.header{
  background:#1f2937;
  color:white;
  padding:15px 20px;
  font-size:22px;
  font-weight:bold;
}

/* LAYOUT */
.container{
  display:flex;
  min-height:calc(100vh - 60px);
}

/* SIDEBAR */
.sidebar{
  width:280px;
  background:white;
  border-right:1px solid #ddd;
  padding:15px;
}

.sidebar h3{
  margin-top:0;
}

.sidebar input,
.sidebar select{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border:1px solid #ccc;
  border-radius:5px;
}

/* MAIN */
.main{
  flex:1;
  padding:15px;
  overflow:auto;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.count{
  color:#666;
}

/* TABLE */
.table-wrap{
  background:white;
  border-radius:8px;
  overflow:auto;
  box-shadow:0 2px 5px rgba(0,0,0,0.08);
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1200px;
}

th,td{
  border-bottom:1px solid #eee;
  padding:10px;
  text-align:left;
  vertical-align:middle;
}

th{
  background:#f9fafb;
  position:sticky;
  top:0;
  z-index:1;
}

tr:hover{
  background:#fafafa;
}

img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:6px;
  border:1px solid #ddd;
}

/* BUTTON */
button{
  border:none;
  padding:8px 12px;
  border-radius:5px;
  cursor:pointer;
}

.upload-btn{
  background:#2563eb;
  color:white;
}

.delete-btn{
  background:#dc2626;
  color:white;
}

.refresh-btn{
  background:#059669;
  color:white;
}

/* POPUP */
.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.popup-box{
  background:white;
  width:400px;
  border-radius:10px;
  padding:20px;
}

.popup-box h3{
  margin-top:0;
}

#error{
  color:red;
  margin-bottom:10px;
}

.loading{
  color:#2563eb;
}

@media(max-width:900px){

  .container{
    flex-direction:column;
  }

  .sidebar{
    width:100%;
    border-right:none;
    border-bottom:1px solid #ddd;
  }

}

</style>
</head>

<body>

<div class="header">
ERP PRODUCT SEARCH
</div>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <h3>Tìm kiếm</h3>

    <input
      id="search_ma"
      placeholder="Mã liệu 品号"
      oninput="render()"
    >

    <input
      id="search_ten"
      placeholder="Tên 品名"
      oninput="render()"
    >

    <input
      id="search_qc"
      placeholder="规格 Quy Cách"
      oninput="render()"
    >

    <input
      id="search_qc2"
      placeholder="规格二"
      oninput="render()"
    >

    <select id="logic" onchange="render()">
      <option value="OR">OR</option>
      <option value="AND">AND</option>
    </select>

    <button
      class="refresh-btn"
      onclick="loadData()"
    >
      Refresh Data
    </button>

  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="topbar">

      <div class="count" id="count">
        Đang tải dữ liệu...
      </div>

    </div>

    <div id="error"></div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>

            <th>品号</th>
            <th>品名</th>
            <th>规格</th>
            <th>规格二</th>
            <th>库存单位</th>
            <th>主要仓库</th>
            <th>图片</th>
            <th>操作</th>

          </tr>
        </thead>

        <tbody id="tb"></tbody>

      </table>

    </div>

  </div>

</div>


<!-- POPUP -->
<div class="popup" id="popup">

  <div class="popup-box">

    <h3>Upload Ảnh</h3>

    <input type="file" id="file">

    <br><br>

    <button
      class="upload-btn"
      onclick="uploadImage()"
    >
      Upload
    </button>

    <button onclick="closePopup()">
      Close
    </button>

  </div>

</div>


<script>

// ================= API =================
const API_URL =
"https://script.google.com/macros/s/AKfycbxuvaL6q6ChkwvrLW4y937eGjpYhDI5oOqj6owAUelsLLZ_SSSvs-fa3GQwttlo3Szs/exec";


// ================= DATA =================
let DATA = [];

let CURRENT_MA = null;


// ================= LOAD DATA =================
async function loadData(){

  try{

    document.getElementById("count").innerHTML =
      "Đang tải dữ liệu...";

    const res = await fetch(API_URL);

    const text = await res.text();

    console.log(text);

    DATA = JSON.parse(text);

    render();

  }catch(err){

    console.error(err);

    document.getElementById("error").innerHTML =
      "Lỗi tải dữ liệu từ Google Sheet";

  }

}


// ================= RENDER =================
function render(){

  const ma =
    document.getElementById("search_ma")
    .value
    .toLowerCase();

  const ten =
    document.getElementById("search_ten")
    .value
    .toLowerCase();

  const qc =
    document.getElementById("search_qc")
    .value
    .toLowerCase();

  const qc2 =
    document.getElementById("search_qc2")
    .value
    .toLowerCase();

  const logic =
    document.getElementById("logic").value;


  let filtered = DATA.filter(d=>{

    const v1 =
      (d["品号"] || "")
      .toString()
      .toLowerCase();

    const v2 =
      (d["品名 Tên"] || "")
      .toString()
      .toLowerCase();

    const v3 =
      (d["规格 Quy Cách"] || "")
      .toString()
      .toLowerCase();

    const v4 =
      (d["规格二"] || "")
      .toString()
      .toLowerCase();


    const c1 = v1.includes(ma);

    const c2 = v2.includes(ten);

    const c3 = v3.includes(qc);

    const c4 = v4.includes(qc2);


    if(logic==="AND"){

      return c1 && c2 && c3 && c4;
    }

    return c1 || c2 || c3 || c4;

  });


  const tb =
    document.getElementById("tb");

  tb.innerHTML = "";


  filtered.forEach(d=>{

    tb.innerHTML += `

      <tr>

        <td>${d["品号"] || ""}</td>

        <td>${d["品名 Tên"] || ""}</td>

        <td>${d["规格 Quy Cách"] || ""}</td>

        <td>${d["规格二"] || ""}</td>

        <td>${d["库存单位"] || ""}</td>

        <td>${d["主要仓库"] || ""}</td>

        <td>

          ${
            d["图片"]

            ? `<img src="${d["图片"]}">`

            : ""
          }

        </td>

        <td>

          <button
            class="upload-btn"
            onclick="openPopup('${d["品号"]}')"
          >
            Upload
          </button>

          <button
            class="delete-btn"
            onclick="deleteImage('${d["品号"]}')"
          >
            Xóa
          </button>

        </td>

      </tr>

    `;
  });


  document.getElementById("count").innerHTML =
    "Tổng: " + filtered.length + " sản phẩm";

}


// ================= POPUP =================
function openPopup(ma){

  CURRENT_MA = ma;

  document.getElementById("popup")
    .style.display = "flex";
}


function closePopup(){

  document.getElementById("popup")
    .style.display = "none";
}


// ================= UPLOAD =================
async function uploadImage(){

  const file =
    document.getElementById("file").files[0];

  if(!file){

    alert("Chọn file");

    return;
  }

  const base64 =
    await toBase64(file);


  await fetch(API_URL,{

    method:"POST",

    body:JSON.stringify({

      action:"upload",

      ma_sp:CURRENT_MA,

      filename:file.name,

      image:base64

    })

  });


  alert("Upload thành công");

  closePopup();

  loadData();

}


// ================= DELETE =================
async function deleteImage(ma_sp){

  if(!confirm("Xóa ảnh?")) return;


  await fetch(API_URL,{

    method:"POST",

    body:JSON.stringify({

      action:"delete",

      ma_sp:ma_sp

    })

  });


  alert("Đã xóa ảnh");

  loadData();

}


// ================= BASE64 =================
function toBase64(file){

  return new Promise(resolve=>{

    const reader = new FileReader();

    reader.onload = ()=>{

      resolve(
        reader.result.split(",")[1]
      );

    };

    reader.readAsDataURL(file);

  });
}


// ================= INIT =================
loadData();

</script>

</body>
</html>
