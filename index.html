<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ERP MINI PRO</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f4f6f9;
}

/* layout */
.container {
  display: flex;
}

/* sidebar filter */
.left {
  width: 260px;
  background: white;
  padding: 15px;
  border-right: 1px solid #ddd;
  height: 100vh;
  position: sticky;
  top: 0;
}

.left input, .left select {
  width: 100%;
  margin-bottom: 10px;
  padding: 8px;
}

/* main */
.right {
  flex: 1;
  padding: 15px;
}

/* table */
table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

th, td {
  border: 1px solid #eee;
  padding: 8px;
  text-align: left;
}

th {
  position: sticky;
  top: 0;
  background: #fafafa;
}

img {
  width: 55px;
  border-radius: 4px;
}

/* popup */
.popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  display: none;
  justify-content: center;
  align-items: center;
}

.box {
  background: white;
  padding: 20px;
  width: 400px;
  border-radius: 6px;
}

button {
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

<!-- FILTER -->
<div class="left">
<h3>FILTER</h3>

<input id="ma" placeholder="Mã SP" oninput="render()">
<input id="ten" placeholder="Tên SP" oninput="render()">
<input id="qc" placeholder="Quy cách" oninput="render()">

<select id="logic" onchange="render()">
  <option value="OR">OR</option>
  <option value="AND">AND</option>
</select>

</div>

<!-- TABLE -->
<div class="right">
<h2>ERP PRODUCT LIST</h2>

<table>
<thead>
<tr>
  <th>Mã</th>
  <th>Tên</th>
  <th>Quy cách</th>
  <th>Đơn vị</th>
  <th>Ảnh</th>
  <th>Action</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>
</div>

</div>

<!-- POPUP UPLOAD -->
<div class="popup" id="popup">
  <div class="box">
    <h3>Upload ảnh sản phẩm</h3>

    <input type="file" id="file"><br><br>

    <button onclick="upload()">Upload</button>
    <button onclick="closePopup()">Hủy</button>
  </div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxuvaL6q6ChkwvrLW4y937eGjpYhDI5oOqj6owAUelsLLZ_SSSvs-fa3GQwttlo3Szs/exec";

let DATA = [];
let currentMa = null;

// ================= LOAD DATA =================
async function load() {
  const res = await fetch(API_URL);
  DATA = await res.json();
  render();
}

// ================= RENDER TABLE =================
function render() {
  const ma = document.getElementById("ma").value.toLowerCase();
  const ten = document.getElementById("ten").value.toLowerCase();
  const qc = document.getElementById("qc").value.toLowerCase();
  const logic = document.getElementById("logic").value;

  let filtered = DATA.filter(d => {

    const m = (d.ma_sp || "").toLowerCase().includes(ma);
    const t = (d.ten_sp || "").toLowerCase().includes(ten);
    const q = (d.quy_cach || "").toLowerCase().includes(qc);

    return logic === "AND" ? (m && t && q) : (m || t || q);
  });

  const tb = document.getElementById("tb");
  tb.innerHTML = "";

  filtered.forEach(d => {
    tb.innerHTML += `
      <tr>
        <td>${d.ma_sp || ""}</td>
        <td>${d.ten_sp || ""}</td>
        <td>${d.quy_cach || ""}</td>
        <td>${d.don_vi || ""}</td>
        <td>
          ${d.image_url ? `<img src="${d.image_url}">` : ""}
        </td>
        <td>
          <button onclick="openPopup('${d.ma_sp}')">Upload</button>
          <button onclick="del('${d.ma_sp}')">Xóa</button>
        </td>
      </tr>
    `;
  });
}

// ================= POPUP =================
function openPopup(ma) {
  currentMa = ma;
  document.getElementById("popup").style.display = "flex";
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
}

// ================= UPLOAD =================
async function upload() {
  const file = document.getElementById("file").files[0];

  if (!file || !currentMa) {
    alert("Chọn file + sản phẩm");
    return;
  }

  const base64 = await toBase64(file);

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "upload",
      ma_sp: currentMa,
      filename: file.name,
      image: base64
    })
  });

  alert("Upload thành công");
  closePopup();
  load();
}

// ================= DELETE IMAGE =================
async function del(ma_sp) {
  if (!confirm("Bạn chắc chắn muốn xóa ảnh?")) return;

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "delete",
      ma_sp
    })
  });

  alert("Đã xóa ảnh");
  load();
}

// ================= BASE64 =================
function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ================= INIT =================
load();

</script>

</body>
</html>
