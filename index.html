<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ERP PRODUCT SYSTEM</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial;
  background:#f4f6f9;
  color:#333;
}

.header{
  background:#1f2937;
  color:white;
  padding:15px 20px;
  font-size:24px;
  font-weight:bold;
}

.container{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:280px;
  background:white;
  padding:20px;
  border-right:1px solid #ddd;
  overflow:auto;
}

.sidebar h3{
  margin-top:0;
}

.sidebar input,
.sidebar select{
  width:100%;
  padding:10px;
  margin-bottom:12px;
  border:1px solid #ccc;
  border-radius:6px;
}

.main{
  flex:1;
  padding:20px;
  overflow:auto;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.count{
  font-size:15px;
  color:#666;
}

.table-wrap{
  background:white;
  border-radius:10px;
  overflow:auto;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#111827;
  color:white;
  padding:12px;
  position:sticky;
  top:0;
  z-index:10;
  white-space:nowrap;
}

td{
  padding:10px;
  border-bottom:1px solid #eee;
  vertical-align:middle;
}

tr:hover{
  background:#f9fafb;
}

img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:6px;
  border:1px solid #ddd;
}

button{
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
  margin:2px;
}

.upload-btn{
  background:#2563eb;
  color:white;
}

.delete-btn{
  background:#dc2626;
  color:white;
}

.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.popup-box{
  background:white;
  width:350px;
  padding:20px;
  border-radius:10px;
}

.popup-box h3{
  margin-top:0;
}

.popup-box input{
  width:100%;
  margin-bottom:15px;
}

.loading{
  position:fixed;
  top:15px;
  right:15px;
  background:#111827;
  color:white;
  padding:10px 15px;
  border-radius:8px;
  display:none;
  z-index:9999;
}

@media(max-width:900px){

  .container{
    flex-direction:column;
  }

  .sidebar{
    width:100%;
    border-right:none;
    border-bottom:1px solid #ddd;
  }

}

</style>
</head>

<body>

<div class="header">
ERP PRODUCT SYSTEM
</div>

<div class="loading" id="loading">
Đang tải dữ liệu...
</div>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <h3>TÌM KIẾM</h3>

    <input
      type="text"
      id="search_ma"
      placeholder="Mã liệu 品号"
      oninput="render()"
    >

    <input
      type="text"
      id="search_ten"
      placeholder="Tên sản phẩm 品名"
      oninput="render()"
    >

    <input
      type="text"
      id="search_qc"
      placeholder="Quy cách 规格"
      oninput="render()"
    >

    <input
      type="text"
      id="search_qc2"
      placeholder="Quy cách 2 规格二"
      oninput="render()"
    >

    <select
      id="logic"
      onchange="render()"
    >
      <option value="OR">OR</option>
      <option value="AND">AND</option>
    </select>

  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="topbar">
      <div class="count" id="count">
        Tổng: 0 sản phẩm
      </div>
    </div>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>Mã liệu</th>
            <th>Tên</th>
            <th>规格</th>
            <th>规格二</th>
            <th>单位</th>
            <th>仓库</th>
            <th>Ảnh</th>
            <th>Thao tác</th>

          </tr>

        </thead>

        <tbody id="tb"></tbody>

      </table>

    </div>

  </div>

</div>


<!-- POPUP -->
<div class="popup" id="popup">

  <div class="popup-box">

    <h3>Upload ảnh sản phẩm</h3>

    <input
      type="file"
      id="file"
      accept="image/*"
    >

    <button
      class="upload-btn"
      onclick="uploadImage()"
    >
      Upload
    </button>

    <button
      onclick="closePopup()"
    >
      Đóng
    </button>

  </div>

</div>



<script>

// ================= CONFIG =================

// GOOGLE SHEET API
const SHEET_API =
"https://script.google.com/macros/s/AKfycbxuvaL6q6ChkwvrLW4y937eGjpYhDI5oOqj6owAUelsLLZ_SSSvs-fa3GQwttlo3Szs/exec";


// FIREBASE REALTIME DATABASE
const FIREBASE_DB =
"https://erp-product-1ccba-default-rtdb.asia-southeast1.firebasedatabase.app/";



// ================= GLOBAL =================
let DATA = [];

let IMAGE_DATA = {};

let currentMa = null;



// ================= LOAD =================
async function load(){

  try{

    showLoading(true);

    // LOAD SHEET
    const res =
      await fetch(SHEET_API);

    DATA =
      await res.json();


    // LOAD FIREBASE IMAGE
    const imgRes =
      await fetch(
        FIREBASE_DB + "images.json"
      );

    IMAGE_DATA =
      await imgRes.json() || {};

    render();

  }catch(err){

    console.error(err);

    alert(
      "Lỗi tải dữ liệu"
    );

  }finally{

    showLoading(false);
  }
}



// ================= RENDER =================
function render(){

  const ma =
    document
    .getElementById("search_ma")
    .value
    .toLowerCase();

  const ten =
    document
    .getElementById("search_ten")
    .value
    .toLowerCase();

  const qc =
    document
    .getElementById("search_qc")
    .value
    .toLowerCase();

  const qc2 =
    document
    .getElementById("search_qc2")
    .value
    .toLowerCase();

  const logic =
    document
    .getElementById("logic")
    .value;



  const filtered =
    DATA.filter(d=>{

      const v1 =
        (d["Mã liệu 品号"] || "")
        .toString()
        .toLowerCase();

      const v2 =
        (d["品名 Tên"] || "")
        .toString()
        .toLowerCase();

      const v3 =
        (d["规格 Quy Cách"] || "")
        .toString()
        .toLowerCase();

      const v4 =
        (d["规格二"] || "")
        .toString()
        .toLowerCase();



      const c1 = v1.includes(ma);

      const c2 = v2.includes(ten);

      const c3 = v3.includes(qc);

      const c4 = v4.includes(qc2);



      if(logic==="AND"){

        return c1 && c2 && c3 && c4;
      }

      return c1 || c2 || c3 || c4;
    });



  const tb =
    document.getElementById("tb");

  tb.innerHTML = "";


  filtered.forEach(d=>{

    const maSp =
      d["Mã liệu 品号"];

    const img =
      IMAGE_DATA[maSp] || "";


    tb.innerHTML += `

      <tr>

        <td>${maSp || ""}</td>

        <td>${d["品名 Tên"] || ""}</td>

        <td>${d["规格 Quy Cách"] || ""}</td>

        <td>${d["规格二"] || ""}</td>

        <td>${d["库存单位"] || ""}</td>

        <td>${d["主要仓库"] || ""}</td>

        <td>

          ${
            img
            ? `<img src="${img}">`
            : ""
          }

        </td>

        <td>

          <button
            class="upload-btn"
            onclick="openPopup('${maSp}')"
          >
            Upload
          </button>

          <button
            class="delete-btn"
            onclick="deleteImage('${maSp}')"
          >
            Xóa
          </button>

        </td>

      </tr>

    `;
  });


  document
    .getElementById("count")
    .innerHTML =

      "Tổng: "
      + filtered.length
      + " sản phẩm";
}



// ================= POPUP =================
function openPopup(ma){

  currentMa = ma;

  document
    .getElementById("popup")
    .style.display = "flex";
}


function closePopup(){

  document
    .getElementById("popup")
    .style.display = "none";
}



// ================= UPLOAD =================
async function uploadImage(){

  const file =
    document
    .getElementById("file")
    .files[0];

  if(!file){

    alert("Chọn file");

    return;
  }


  try{

    showLoading(true);

    const base64 =
      await toBase64(file);


    await fetch(

      FIREBASE_DB
      + "images/"
      + encodeURIComponent(currentMa)
      + ".json",

      {

        method:"PUT",

        body:
          JSON.stringify(base64)
      }
    );


    alert(
      "Upload thành công"
    );

    closePopup();

    load();

  }catch(err){

    console.error(err);

    alert(
      "Upload thất bại"
    );

  }finally{

    showLoading(false);
  }
}



// ================= DELETE =================
async function deleteImage(ma){

  if(
    !confirm("Xóa ảnh?")
  ) return;


  try{

    showLoading(true);

    await fetch(

      FIREBASE_DB
      + "images/"
      + encodeURIComponent(ma)
      + ".json",

      {

        method:"DELETE"
      }
    );


    alert(
      "Đã xóa ảnh"
    );

    load();

  }catch(err){

    console.error(err);

    alert(
      "Xóa thất bại"
    );

  }finally{

    showLoading(false);
  }
}



// ================= BASE64 =================
function toBase64(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onload = ()=>{

      resolve(
        reader.result
      );
    };

    reader.onerror =
      reject;

    reader.readAsDataURL(file);
  });
}



// ================= LOADING =================
function showLoading(show){

  document
    .getElementById("loading")
    .style.display =

      show
      ? "block"
      : "none";
}



// ================= START =================
load();

</script>

</body>
</html>
